import os
import shlex

if 'I8085' not in config.root.targets:
    config.unsupported = True

this_dir = os.path.dirname(__file__)
default_sdk_root = os.path.normpath(
    os.path.join(this_dir, '..', '..', '..', '..', '..'))
sdk_root = os.path.abspath(
    os.environ.get('I8085_SDK_ROOT', default_sdk_root))
tool_bin = config.llvm_tools_dir
sysroot_crt = os.path.join(sdk_root, 'sysroot', 'crt', 'crt0.S')
sysroot_ld = os.path.join(
    sdk_root, 'sysroot', 'ldscripts', 'i8085-32kram-32krom.ld')
sim_bin = os.path.abspath(os.environ.get(
    'I8085_SIM',
    os.path.join(sdk_root, 'i8085-trace', 'build', 'i8085-trace')))
objcopy_bin = os.path.join(tool_bin, 'llvm-objcopy')

def is_executable(path):
    return os.path.isfile(path) and os.access(path, os.X_OK)

tool_paths = {
    'clang': os.path.join(tool_bin, 'clang'),
    'llc': os.path.join(tool_bin, 'llc'),
    'ld.lld': os.path.join(tool_bin, 'ld.lld'),
    'llvm-objcopy': objcopy_bin,
}
have_toolchain = all(is_executable(path) for path in tool_paths.values())
have_sysroot = os.path.isfile(sysroot_crt) and os.path.isfile(sysroot_ld)
have_sim = is_executable(sim_bin)

if os.environ.get('I8085_SIM') and not have_sim:
    lit_config.warning('I8085_SIM does not name an executable: {}'.format(sim_bin))

if have_toolchain and have_sysroot and have_sim:
    config.available_features.add('i8085-sim')

config.substitutions.extend([
    ('%i8085_clang', shlex.quote(tool_paths['clang'])),
    ('%i8085_llc', shlex.quote(tool_paths['llc'])),
    ('%i8085_lld', shlex.quote(tool_paths['ld.lld'])),
    ('%i8085_objcopy', shlex.quote(tool_paths['llvm-objcopy'])),
    ('%i8085_sim', shlex.quote(sim_bin)),
    ('%i8085_sdk', shlex.quote(sdk_root)),
])

config.substitutions.append(('%testdump_addr', '0xFF00'))
