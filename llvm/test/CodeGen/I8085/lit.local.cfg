import os
import shutil

if 'I8085' not in config.root.targets:
    config.unsupported = True

this_dir = os.path.dirname(__file__)
repo_root = os.path.normpath(os.path.join(this_dir, '..', '..', '..', '..', '..'))
tool_bin = os.path.join(repo_root, 'tooling', 'build', 'build-clang-8085', 'bin')
sysroot_crt = os.path.join(repo_root, 'sysroot', 'crt', 'crt0.S')
sysroot_ld = os.path.join(repo_root, 'sysroot', 'ldscripts', 'i8085-32kram-32krom.ld')
sim_bin = os.path.join(repo_root, 'i8085-trace', 'build', 'i8085-trace')
objcopy_bin = os.path.join(tool_bin, 'llvm-objcopy')

have_toolchain = all(os.path.exists(os.path.join(tool_bin, exe))
                     for exe in ['clang', 'llc', 'ld.lld'])
have_sysroot = os.path.exists(sysroot_crt) and os.path.exists(sysroot_ld)
have_sim = os.path.exists(sim_bin)
have_objcopy = (shutil.which('llvm-objcopy') is not None or os.path.exists(objcopy_bin))

if os.environ.get('I8085_SIM') or (have_toolchain and have_sysroot and have_sim and have_objcopy):
    config.available_features.add('i8085-sim')
    # Ensure llvm-objcopy is available even if not on the user's PATH.
    if os.path.isdir(tool_bin):
        config.environment['PATH'] = tool_bin + os.pathsep + config.environment.get('PATH', '')
    if os.path.exists(objcopy_bin):
        config.substitutions.insert(0, ('llvm-objcopy', objcopy_bin))

config.substitutions.append(('%testdump_addr', '0xFF00'))
